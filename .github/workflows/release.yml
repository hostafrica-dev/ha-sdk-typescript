name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version
      - run: npm ci
      - run: npm run build
      - run: zip -r dist.zip dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist.zip
